name: Publish the biological-maintenance site

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/**'
      - 'simulations/biological-immortality/report.md'
      - 'simulations/biological-immortality/outputs/**'
      - 'simulations/biological-immortality/simulate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      # One-time repository-owner setup: Settings > Pages > Source: GitHub Actions.
      # configure-pages can deploy only after that Pages site has been enabled.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Add the canonical report and outputs to the Jekyll source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          from shutil import copytree

          report = Path("simulations/biological-immortality/report.md").read_text(encoding="utf-8")
          report = report.replace("] (outputs/results.md)", "]({{ '/biological-immortality/outputs/results/' | relative_url }})")
          report = report.replace("](outputs/results.md)", "]({{ '/biological-immortality/outputs/results/' | relative_url }})")
          report_front_matter = dedent("""\
          ---
          layout: default
          title: Can human biological function be maintained indefinitely?
          permalink: /biological-immortality/
          description: A cited research synthesis and illustrative simulation report on biological maintenance and longevity.
          ---

          """)
          Path("docs/biological-immortality.md").write_text(report_front_matter + report, encoding="utf-8")
          copytree("simulations/biological-immortality/outputs", "docs/biological-immortality/outputs", dirs_exist_ok=True)
          results_path = Path("docs/biological-immortality/outputs/results.md")
          results_body = results_path.read_text(encoding="utf-8")
          results_front_matter = dedent("""\
          ---
          layout: default
          title: Detailed simulation outputs
          permalink: /biological-immortality/outputs/results/
          ---

          """)
          results_path.write_text(results_front_matter + results_body, encoding="utf-8")
          PY
      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
